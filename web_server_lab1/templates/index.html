<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều khiển LED Raspberry Pi 4</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .btn { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-on { background-color: #4CAF50; }
        .btn-off { background-color: #f44336; }
        #status { font-size: 20px; font-weight: bold; margin-top: 20px; color: #555; }
    </style>
</head>
<body>
    <h1>Điều khiển đèn LED qua Web Server</h1>
    <button class="btn btn-on" onclick="sendAction('on')">Bật Đèn</button>
    <button class="btn btn-off" onclick="sendAction('off')">Tắt Đèn</button>
    <div id="status">Trạng thái: Đang Tắt</div>

    <script>
        function sendAction(action) {
            fetch('/led/' + action)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('status').innerText = 'Trạng thái: ' + data;
                });
            }
    </script>
</body>
</html>
