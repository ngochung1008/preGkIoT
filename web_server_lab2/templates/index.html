<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giám sát Cảm biến & Điều khiển Servo</title>
    <style>
        body { font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 40px; 
            background-color: #f4f4f9; 
        }
        .card { background: white; padding: 20px; margin: 20px auto; 
            width: 350px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; 
            border: none; border-radius: 5px; background-color: #008CBA; color: white; }
        .btn:hover { background-color: #007399; }
        #distance { font-size: 28px; font-weight: bold; color: #333; }
        input[type=range] { width: 100%; margin: 15px 0; }
    </style>
</head>
<body>
    <h1>Hệ thống IoT Raspberry Pi 4</h1>

    <div class="card">
        <h3>Cảm biến siêu âm HC-SR04</h3>
        <p>Khoảng cách hiện tại:</p>
        <div id="distance">-- cm</div>
    </div>

    <div class="card">
        <h3>Điều khiển Động cơ Servo</h3>
        <button class="btn" onclick="setServo(0)">0°</button>
        <button class="btn" onclick="setServo(90)">90°</button>
        <button class="btn" onclick="setServo(180)">180°</button>
        <br><br>
        <label for="servoRange">Thanh trượt góc (0° - 180°):</label>
        <input type="range" id="servoRange" min="0" max="180" value="90" oninput="setServo(this.value)">
        <p id="status">Trạng thái Servo: Đang chờ lệnh</p>
    </div>

    <script>
        // Tự động cập nhật khoảng cách từ cảm biến mỗi 1 giây
        function fetchDistance() {
            fetch('/get_distance')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('distance').innerText = data.distance + ' cm';
                });
        }
        setInterval(fetchDistance, 1000);

        // Gửi lệnh điều khiển góc Servo
        function setServo(angle) {
            document.getElementById('servoRange').value = angle;
            fetch('/servo/' + angle)
                .then(response => response.text())
                .then(data => {
                    document.getElementById('status').innerText = data;
                });
        }
    </script>
</body>
</html>
